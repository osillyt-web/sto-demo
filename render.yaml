services:
  - type: web
    name: sto-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        sync: false          # пароль задаётся в панели Render, в репозитории его нет
